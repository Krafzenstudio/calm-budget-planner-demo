.calendar-pay{font-size:10px!important;min-height:27px!important;min-width:27px!important;padding:2px!important;border-radius:50%!important;background:var(--accent)!important;color:var(--accentink)!important}.cal-pay-actions{display:flex;gap:2px;flex-wrap:wrap;margin:2px 0}.datecell{min-width:0;overflow:hidden}@media(max-width:720px){.calendar-pay{min-height:25px!important;min-width:25px!important}.cal-pay-actions{gap:1px}} .demobanner{background:#2f5d3f;color:#fff;text-align:center;padding:11px 12px;font-size:15px;line-height:1.4}.demobanner a{color:#fff;text-decoration:underline;font-weight:700}</style></head><body data-theme="midnight"><div class="demobanner">DEMO &mdash; Example numbers. <a href="https://krafzenstudio.etsy.com" target="_blank" rel="noopener">Get the full planner on Etsy &rarr;</a></div><div id="app"></div><div id="modal" class="overlay hidden" role="dialog" aria-modal="true"><div class="modal" id="modalContent"></div></div><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const STORE='krafzen.calm.budget.demo.v1',BACKUP_META='krafzen.calm.budget.demo.backup',BACKUP_NUDGE='krafzen.calm.budget.demo.backup.nudge',TODAY=()=>new Date().toLocaleDateString('en-CA'),MS=86400000;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const iso=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const date=s=>new Date(String(s)+'T12:00:00');const addDays=(s,n)=>iso(new Date(date(s).getTime()+n*MS));const month=s=>String(s).slice(0,7);const endDay=(y,m)=>new Date(y,m,0).getDate();
const moneyVal=v=>Math.round((Number(v)||0)*100)/100;const cents=v=>Math.round((Number(v)||0)*100);
const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmtDate=s=>date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const currencies=['USD','GBP','EUR','CAD','AUD','NZD','INR','PKR','AED','SAR','JPY','CHF','SGD','ZAR','MYR','BDT'];
const categories=['Groceries','Food & drink','Transport','Shopping','Home','Health','Entertainment','Family','Bills','Other'];
function demo(){const t=TODAY(),m=month(t);return {id:'main',name:'My calm planner',currency:'USD',theme:'midnight',accent:'',view:'everything',onboard:0,exampleMode:true,lastSeen:t,cardPrefs:{runway:true,next:true,quick:true,bills:true,goals:true,analytics:true,brain:true},accounts:[{id:uid(),name:'Everyday checking',kind:'checking',balance:4425.20},{id:uid(),name:'Rainy day savings',kind:'savings',balance:1450}],income:[{id:uid(),name:'Main paycheck',amount:2100,schedule:'biweekly',anchor:addDays(t,-7),splits:10},{id:uid(),name:'Side work',amount:450,schedule:'monthly',anchor:m+'-20',splits:0}],bills:[{id:uid(),name:'Rent',amount:980,cycle:'monthly',anchor:m+'-01',day:1,day2:15,interval:1,setAside:false},{id:uid(),name:'Internet',amount:65,cycle:'monthly',anchor:m+'-18',day:18,interval:1,setAside:false},{id:uid(),name:'Phone',amount:48,cycle:'monthly',anchor:m+'-25',day:25,interval:1,setAside:false},{id:uid(),name:'Car insurance',amount:360,cycle:'months',anchor:m+'-12',day:12,interval:6,setAside:true}],billPayments:[],paychecks:[],spends:[{id:uid(),date:addDays(t,-2),amount:32.5,category:'Groceries',note:'Market'},{id:uid(),date:addDays(t,-1),amount:12,category:'Food & drink',note:'Coffee & snack'}],transfers:[],goals:[{id:uid(),name:'Weekend getaway',target:900,saved:240,due:addDays(t,180)}],debts:[{id:uid(),name:'Everyday credit card',kind:'card',balance:420,apr:23.99,minimum:35,dueDay:22},{id:uid(),name:'Student loan',kind:'loan',balance:3200,apr:5.5,minimum:75,dueDay:14}],debtPayments:[],envelopes:[{id:uid(),name:'Groceries',amount:300},{id:uid(),name:'Fun money',amount:100}],budgets:[{id:uid(),name:'Groceries',limit:350},{id:uid(),name:'Food & drink',limit:140}],challenges:[{id:uid(),name:'52-week challenge',kind:'weeks',target:1378,progress:0},{id:uid(),name:'No-spend days',kind:'days',target:15,progress:0}],milestones:[],notes:{},brain:'',strategy:'snowball',startFresh:null};}
function initial(){return {version:1,active:'main',profiles:[demo()]}};
let storageWorks=false;try{const testKey=STORE+'.storage-check';localStorage.setItem(testKey,'ok');storageWorks=localStorage.getItem(testKey)==='ok';localStorage.removeItem(testKey)}catch(e){storageWorks=false}
let db;try{db=JSON.parse(storageWorks?localStorage.getItem(STORE):null);if(!db||!Array.isArray(db.profiles)||!db.profiles.length)db=initial()}catch{db=initial()};
let page='Today',selectedMonth=month(TODAY()),focus=false,query='',quickAmount=20,formState={},enhanceGoalId=null;
const p=()=>db.profiles.find(x=>x.id===db.active)||db.profiles[0];
const DEMO=true;
function demoCount(pp){pp=pp||p();return (pp.bills?.length||0)+(pp.income?.length||0)+(pp.spends?.length||0)+(pp.goals?.length||0)+(pp.debts?.length||0);}
function demoBaseTotal(pp){const b=pp.demoBaseline||{};return (b.bills||0)+(b.income||0)+(b.spends||0)+(b.goals||0)+(b.debts||0);}
function demoSetBase(pp){pp.demoBaseline={bills:pp.bills?.length||0,income:pp.income?.length||0,spends:pp.spends?.length||0,goals:pp.goals?.length||0,debts:pp.debts?.length||0};}

function save(){if(!storageWorks)return;try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){storageWorks=false;toast('Saving is blocked here. Please export a backup.')} };
function change(fn){if(!DEMO){fn();save();render();return;}const cur0=p();if(!cur0.demoBaseline){demoSetBase(cur0);}const before=JSON.stringify(db);let beforeP=null;try{const bdb=JSON.parse(before);beforeP=bdb.profiles.find(x=>x.id===bdb.active)||bdb.profiles[0];}catch(e){}fn();const cur=p();let baseTotal=demoBaseTotal(cur);const curTotal=demoCount(cur);if(curTotal<baseTotal||(beforeP&&beforeP.exampleMode!==true&&cur.exampleMode===true)){demoSetBase(cur);baseTotal=demoCount(cur);}if(curTotal-baseTotal>20){db=JSON.parse(before);save();render();setTimeout(()=>{modal(`<h2>Demo limit reached</h2><p>This demo allows 20 new entries. This entry was not saved. Get the full planner to keep adding without limits.</p><div class="formactions"><a class="btn primary" href="https://krafzenstudio.etsy.com" target="_blank" rel="noopener">Get the full planner on Etsy &rarr;</a> <button class="btn" onclick="document.getElementById('modal').classList.add('hidden')">Keep exploring</button></div>`);},50);return;}save();render();};
function money(v){try{return new Intl.NumberFormat('en-US',{style:'currency',currency:p().currency,maximumFractionDigits:2}).format(v||0)}catch{return (v||0).toFixed(2)}}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3200)}
function generated(b,from,to){const a=date(from),z=date(to),start=date(b.anchor||from),out=[];if(!Number.isFinite(start.getTime()))return out;const push=d=>{const s=iso(d);if(s>=from&&s<=to)out.push(s)};
const cycle=b.cycle||b.schedule||'monthly',day=Math.min(31,Math.max(1,Number(b.day)||start.getDate()));
if(cycle==='once'){push(start);return out}
if(['weekly','biweekly'].includes(cycle)){const step=cycle==='weekly'?7:14;let d=new Date(start);if(d<a){const steps=Math.floor((a-d)/MS/step);d=new Date(d.getTime()+steps*step*MS)}for(let n=0;n<1000&&d<=z;n++,d=new Date(d.getTime()+step*MS))push(d);return [...new Set(out)].sort()}
const interval=cycle==='months'?Math.max(2,Math.min(12,Number(b.interval)||2)):1;
for(let year=a.getFullYear()-1;year<=z.getFullYear()+1;year++)for(let mm=0;mm<12;mm++){const index=(year-start.getFullYear())*12+mm-start.getMonth();if(index<0||index%interval!==0)continue;let days=cycle==='twice'?[day,Math.max(1,Math.min(31,Number(b.day2)||15))]:[day];for(const d0 of days){let d=new Date(year,mm,Math.min(d0,endDay(year,mm+1)),12);if(d<start&&!(cycle==='twice'&&year===start.getFullYear()&&mm===start.getMonth()))continue;push(d)}}return [...new Set(out)].sort()}
function salaryDates(item,from,to){let sched=item.schedule||'monthly',raw=generated({...item,cycle:sched},addDays(from,-4),to);return [...new Set(raw.map(s=>{let d=date(s);if(d.getDay()===6)return addDays(s,-1);if(d.getDay()===0)return addDays(s,-2);return s}))].filter(x=>x>=from&&x<=to).sort()}
const paidKey=(id,d)=>String(id)+'|'+String(d);
function paymentMatches(x,id,d){if(!x)return false;const key=paidKey(id,d);return x.key===key||(String(x.billId??x.id??'')===String(id)&&String(x.occurrenceDate??x.date??'')===String(d));}
function paymentFor(id,d){return (p().billPayments||[]).find(x=>paymentMatches(x,id,d));}
function paymentHistory(){return (p().billPayments||[]).map(x=>{const parts=String(x.key||'').split('|'),id=String(x.billId??parts[0]??''),d=String(x.occurrenceDate??x.date??parts[1]??''),bill=p().bills.find(b=>String(b.id)===id);return {...x,billId:id,date:d,key:paidKey(id,d),name:x.name||bill?.name||'Deleted bill',amount:Number(x.amount??bill?.amount??0)}}).sort((a,b)=>b.date.localeCompare(a.date));}
function billEvents(from,to){return p().bills.flatMap(b=>generated(b,from,to).map(d=>({...b,date:d,key:paidKey(b.id,d),paid:!!paymentFor(b.id,d)}))).sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name))}
function incomeEvents(from,to){return p().income.flatMap(i=>salaryDates(i,from,to).map(d=>({...i,date:d,key:paidKey(i.id,d),received:p().paychecks.some(x=>x.key===paidKey(i.id,d))}))).sort((a,b)=>a.date.localeCompare(b.date))}
function nextPayday(){return incomeEvents(TODAY(),addDays(TODAY(),366)).find(x=>!x.received)||null}
function openBillsTill(d){return billEvents(addDays(TODAY(),-365),d).filter(b=>!b.paid)}
function reserved(){const pp=p(),day=TODAY(),pay=nextPayday(),until=pay?pay.date:addDays(day,30);const bills=openBillsTill(until),overdue=bills.filter(x=>x.date<day),upcoming=bills.filter(x=>x.date>=day);const checking=pp.accounts.filter(x=>x.kind!=='savings').reduce((a,x)=>a+cents(x.balance),0);const card=pp.debts.filter(x=>x.kind==='card').reduce((a,x)=>a+cents(x.balance),0);const recurring=pp.bills.filter(x=>x.setAside&&x.cycle==='months').reduce((a,x)=>a+Math.round(cents(x.amount)/Math.max(2,Number(x.interval)||2)),0);const goals=pp.goals.reduce((a,x)=>a+cents(x.saved),0);const envelopes=pp.envelopes.reduce((a,x)=>a+cents(x.amount),0);const due=bills.reduce((a,x)=>a+cents(x.amount),0);return {checking,card,overdue:overdue.reduce((a,x)=>a+cents(x.amount),0),upcoming:upcoming.reduce((a,x)=>a+cents(x.amount),0),recurring,goals,envelopes,due,available:checking-card-due-recurring-goals-envelopes,payday:pay,bills}}
const percent=(a,b)=>b>0?Math.max(0,Math.min(100,100*a/b)):0;
const prog=(a,b)=>`<div class="progress"><i style="width:${percent(a,b)}%"></i></div>`;
const btn=(label,act,kind='')=>`<button class="${kind}" data-action="${act}">${label}</button>`;
const noData=msg=>`<div class="empty">${msg}</div>`;
function nextThing(){const r=reserved();if(r.bills.some(x=>x.date<TODAY()))return `You have an overdue bill to review: ${esc(r.bills.find(x=>x.date<TODAY()).name)}.`;if(!p().income.length)return 'Add your first paycheck to see your payday runway.';if(!p().accounts.length)return 'Add a checking account to make your safe-to-spend number meaningful.';if(r.bills.length)return `Check your next bill: ${esc(r.bills[0].name)} on ${fmtDate(r.bills[0].date)}.`;return 'Log one recent spend. That is enough for now.'}

let backupDismissed=false;
function readinessBanners(){let blocks=[];if(!storageWorks)blocks.push(`<div class="info-bar" role="status"><div><strong>Saving is blocked in this viewer</strong> — open this file in Chrome or Safari so your entries are saved.</div>${btn('Learn how','storageHelp')}</div>`);if(p().exampleMode===true && p().onboard>=5)blocks.push(`<div class="info-bar"><div><strong>Example numbers — not your real money.</strong> Tap Start fresh to enter yours.</div>${btn('Start fresh','fresh','primary')}</div>`);if(p().onboard>=5&&!backupDismissed){let last=null;try{last=storageWorks?localStorage.getItem(BACKUP_META):null}catch(e){}let lastPrompt=null;try{lastPrompt=storageWorks?localStorage.getItem(BACKUP_NUDGE):null}catch(e){}if(!lastPrompt&&storageWorks){try{localStorage.setItem(BACKUP_NUDGE,TODAY());lastPrompt=TODAY()}catch(e){}}if((!last||((date(TODAY())-date(last))/MS>=7)) && (!lastPrompt || (date(TODAY())-date(lastPrompt))/MS>=7))blocks.push(`<div class="info-bar"><div><strong>Friendly reminder:</strong> Keep a backup of your planners somewhere safe.</div><div class="row">${btn('Back up now','export','primary')}${btn('Not now','dismissBackup')}</div></div>`)}return blocks.length?`<div class="stack section">${blocks.join('')}</div>`:''}
const faqItems=[
['What is Safe to Spend?','It is your spendable checking money after subtracting cards, unpaid bills due through your next payday, goals, envelopes and monthly set-asides. Bills after your next payday are not reserved yet.'],
['Why is my number negative?','Your recorded commitments are higher than your spendable balance. Check your account amounts, unpaid bills and reserved goals; this is a planning estimate, not a bank overdraft notice.'],
['Where is my data stored?','On this device in your browser’s local storage when the browser permits it. It does not automatically sync between devices.'],
['Does it connect to my bank?','Never. There is no bank connection, no account and no password. You enter and update your own figures.'],
['Is there a subscription?','No. This is a one-time purchase with no in-app subscription.'],
['What happens if I lose the file?','Keep a copy of the original HTML download and your exported JSON backups. The HTML file alone cannot restore entries that were stored on another device.'],
['How do I move to a new phone?','Export a full JSON backup on the old device, copy the HTML app and backup file to the new device, then use Import JSON backup in Settings.'],
['How do I add a second planner for a family member?','Choose + Planner at the top or Add planner in Settings. Each profile has separate financial records, and the same JSON backup includes all profiles.'],
['How do I back up my data?','Go to Settings and select Download full JSON backup. Save the file somewhere you can retrieve it; Import JSON backup restores all planners together.'],
['How do I delete/reset everything?','Use Start fresh in Settings to reset the active planner. To remove all local data, clear this app’s browser storage; export a backup first if you might need your entries.'],
['How do I get updates?','Use the updated HTML file provided by KrafzenStudio, when available, and import your most recent JSON backup. This offline file cannot download updates by itself.']
];
function helpMarkup(inWizard=false){return `<div class="eyebrow">Calm guidance</div><h2>Help & FAQ</h2><p class="caption">Short answers for common questions. Your budget data stays private on your device.</p><div class="stack">${faqItems.map(([q,a])=>`<div class="notice"><strong>${esc(q)}</strong><div class="caption" style="margin-top:6px">${esc(a)}</div></div>`).join('')}</div>${inWizard?`<div class="formactions">${btn('Back to setup','backToOnboard','primary')}</div>`:''}`}
function helpPage(){return `<div class="stack"><div class="hero"><div class="eyebrow">Help & FAQ</div><h2>Answers, without overwhelm.</h2><p class="muted">Everything you need to start, save and protect your planner.</p></div><div class="card">${helpMarkup()}</div><div class="card"><h2>Backup and restore</h2><p class="caption">One complete JSON backup includes every planner, transaction, bill and setting.</p><div class="actions">${btn('Export JSON backup','export','primary')}${btn('Import JSON backup','import')}</div></div></div>`}

function header(){const names=['Today','Month','Must-pays','Money in','Goals','Debt','Envelopes','Milestones','Notes','Reports','Settings','Help'];const nav=names.filter(x=>p().view!=='simple'||['Today','Month','Must-pays','Money in','Settings'].includes(x));return `<div class="sidebar"><div class="brand"><div class="logo">✦</div><div>Calm Budget<small>KRAFZEN STUDIO</small></div></div><nav class="nav">${nav.map((x,i)=>`<button data-page="${x}" class="${x===page?'active':''}"><span>${({'Today':'◈','Month':'▦','Must-pays':'◷','Money in':'↗','Goals':'◎','Debt':'⇩','Envelopes':'▣','Milestones':'✧','Notes':'≡','Reports':'▤','Settings':'⚙','Help':'?'})[x]}</span>${x}</button>`).join('')}</nav><div class="sidebottom">Private by design · Stored on this device<br>Not a medical or financial product.</div></div><main><div class="top"><div class="row"><button class="menu-toggle" data-action="menu">☰</button><div><div class="eyebrow">A little clarity, every day</div><h1>${esc(page)}</h1></div></div><div class="topactions"><select id="profileSwitch" class="profile" aria-label="Select planner">${db.profiles.map(x=>`<option value="${esc(x.id)}" ${db.active===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button data-action="newProfile">+ Planner</button><button data-action="search">⌕ Search</button><button data-action="focus">${focus?'Exit focus':'◉ Focus'}</button></div></div><div id="content">`}
function footer(){return `</div>${focus?`<button class="focus-exit" data-action="focus">Exit focus ✕</button>`:''}<div class="secondary caption" style="text-align:center;padding:24px">Calm Budget Planner · Krafzen Studio · Local-only · Not a medical or financial product.</div></main><div class="mobilebar"><button data-page="Today"><span>◈</span>Today</button><button data-page="Month"><span>▦</span>Month</button><button data-page="Must-pays"><span>◷</span>Bills</button><button data-page="Money in"><span>↗</span>Income</button><button data-page="Settings"><span>⚙</span>More</button></div>`}
function render(){const r=reserved();document.body.dataset.theme=p().theme||'midnight';document.body.style.setProperty('--accent',p().accent||'');if(!p().accent)document.body.style.removeProperty('--accent');document.body.classList.toggle('focus',focus);document.getElementById('app').innerHTML=`<div class="app">${header()}${readinessBanners()}${({'Today':today,'Month':monthPage,'Must-pays':billsPage,'Money in':incomePage,'Goals':goalsPage,'Debt':debtPage,'Envelopes':envelopePage,'Milestones':milestonePage,'Notes':notesPage,'Reports':reportsPage,'Settings':settingsPage,'Help':helpPage})[page]?.(r)||today(r)}${footer()}</div>`;if(p().onboard<5)showOnboarding();else document.body.classList.remove('onboarding-active');}
function today(r){const cfg=p().cardPrefs||{},billWeek=billEvents(TODAY(),addDays(TODAY(),7)).filter(x=>!x.paid);return `<div class="stack"><div class="hero"><span class="pill">✦ Your calm money snapshot</span><div style="margin-top:23px;color:var(--muted);font-weight:750">SAFE TO SPEND TODAY</div><div class="amount ${r.available<0?'negative':''}">${money(r.available/100)}</div><p class="muted" style="max-width:480px">Your checking money, minus the commitments you have already made. A guide, not a guarantee of cleared funds.</p><div class="actions"><button class="primary" data-action="breakdown">How is this worked out? ↗</button><button data-action="quickSpend">+ Log a spend</button></div></div>${cfg.next!==false?`<div class="notice"><div class="eyebrow">Just one next step</div><strong>${nextThing()}</strong></div>`:''}${cfg.runway!==false?`<div class="grid"><div class="card"><h2>Until your next payday</h2><div class="kpi">${r.payday?fmtDate(r.payday.date):'No payday set'}</div><div class="caption">${r.payday?`${esc(r.payday.name)} · ${money(r.payday.amount)}`:'Add income in Money in to see your runway.'}</div><div class="divider"></div><strong>Day-by-day forecast</strong><div class="caption">Illustrative balance after scheduled unpaid bills; future income not assumed until received.</div>${forecast(r)}</div><div class="card"><h2>Money at a glance</h2><div class="kpi-row"><div><span class="muted">Checking</span><div class="kpi">${money(r.checking/100)}</div></div><div><span class="muted">Bills reserved</span><div class="kpi">${money(r.due/100)}</div></div></div><div class="divider"></div><div class="barrow"><span class="muted">Credit card balances</span><strong>${money(r.card/100)}</strong></div><div class="barrow"><span class="muted">Goals + envelopes</span><strong>${money((r.goals+r.envelopes)/100)}</strong></div><div class="barrow"><span class="muted">Set-aside per month</span><strong>${money(r.recurring/100)}</strong></div></div></div>`:''}${cfg.quick!==false?`<div class="grid"><div class="card"><h2>Quick spend · no fuss</h2><div class="quick">${[5,10,20,50,100].map(v=>`<button data-amount="${v}" class="${quickAmount===v?'primary':''}">${money(v)}</button>`).join('')}</div><div class="fields" style="margin-top:14px"><div class="field"><label>Amount</label><input id="quickValue" type="number" min="0.01" step="0.01" value="${quickAmount}"></div><div class="field"><label>Category</label><select id="quickCategory">${categories.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field wide"><label>Optional note</label><input id="quickNote" placeholder="What was it for?"></div></div><div class="formactions"><button class="primary" data-action="saveQuick">Save spend ↗</button></div></div><div class="card"><h2>Quick actions</h2><p class="caption">Try “20 groceries”, “45 transport”, “bills”, “goals” or “report”.</p><input id="command" placeholder="20 groceries"><div class="formactions"><button class="primary" data-action="command">Go ↗</button></div><div class="divider"></div><p class="caption">A small action is still progress. No streaks, no judgement.</p></div></div>`:''}${cfg.bills!==false?`<div class="card"><div class="row space"><h2>Bills coming in the next 7 days</h2>${btn('All must-pays','gotoBills')}</div>${billWeek.length?billWeek.slice(0,5).map(b=>`<div class="item"><div><strong>${esc(b.name)}</strong><div class="small muted">${fmtDate(b.date)}</div></div><div class="row"><strong>${money(b.amount)}</strong>${btn('Mark paid','payBill:'+b.key,'tiny')}</div></div>`).join(''):noData('All clear for the next seven days.')}</div>`:''}${cfg.goals!==false?`<div class="card"><div class="row space"><h2>Goals in motion</h2>${btn('View goals','gotoGoals')}</div>${p().goals.slice(0,3).map(g=>`<div class="item" style="display:block"><div class="barrow"><strong>${esc(g.name)}</strong><span class="muted">${money(g.saved)} / ${money(g.target)}</span></div>${prog(g.saved,g.target)}</div>`).join('')||noData('Add a small goal when you feel ready.')}</div>`:''}${cfg.analytics!==false?`<div class="card"><div class="row space"><h2>This month, in perspective</h2>${btn('Full reports','gotoReports')}</div>${categoryBars(month(TODAY()))}</div>`:''}${cfg.brain!==false?`<div class="card"><h2>Brain dump · thoughts only</h2><p class="caption">This stays separate from all money calculations.</p><textarea id="brain" placeholder="Put your thoughts here. No amount or category needed.">${esc(p().brain||'')}</textarea><div class="formactions"><button data-action="saveBrain" class="primary">Save thoughts</button></div></div>`:''}</div>`}

function reportsPage(){let m=selectedMonth,sp=p().spends.filter(s=>month(s.date)===m),inc=incomeEvents(m+'-01',m+'-'+endDay(+m.slice(0,4),+m.slice(5))).filter(x=>x.received).reduce((s,i)=>s+i.amount,0),bills=billEvents(m+'-01',m+'-'+endDay(+m.slice(0,4),+m.slice(5))).filter(x=>x.paid).reduce((s,b)=>s+b.amount,0),spent=sp.reduce((s,x)=>s+x.amount,0),total=spent+bills,savings=inc>0?(inc-total)/inc*100:0,year=Number(m.slice(0,4)),mo=Number(m.slice(5)),trend=Array.from({length:6},(_,i)=>{let d=new Date(year,mo-6+i,1),mm=iso(d).slice(0,7);return {month:mm,label:d.toLocaleDateString('en-US',{month:'short'}),spend:p().spends.filter(s=>month(s.date)===mm).reduce((s,x)=>s+x.amount,0),income:incomeEvents(mm+'-01',mm+'-'+endDay(d.getFullYear(),d.getMonth()+1)).filter(x=>x.received).reduce((s,x)=>s+x.amount,0)}}),max=Math.max(1,...trend.map(x=>Math.max(x.spend,x.income)));return `<div class="stack"><div class="row space"><div class="muted">Explore spending trends and patterns.</div><input type="month" id="reportMonth" value="${m}" style="max-width:200px"></div><div class="grid three"><div class="card"><div class="muted">Money in · recorded</div><div class="kpi">${money(inc)}</div></div><div class="card"><div class="muted">Money out · spends + paid bills</div><div class="kpi">${money(total)}</div></div><div class="card"><div class="muted">Savings rate · based on records</div><div class="kpi">${inc?`${savings.toFixed(1)}%`:'—'}</div></div></div><div class="grid"><div class="card"><h2>Spending by category</h2>${categoryBars(m)}</div><div class="card"><h2>Income vs spending · six months</h2><div class="chart">${trend.map(x=>`<div class="chartcol"><div class="row" style="align-items:end;width:100%;height:140px;justify-content:center;gap:4px"><div class="chartbar alt" title="Income ${money(x.income)}" style="height:${Math.max(2,x.income/max*136)}px;width:32%"></div><div class="chartbar" title="Spends ${money(x.spend)}" style="height:${Math.max(2,x.spend/max*136)}px;width:32%"></div></div>${x.label}</div>`).join('')}</div><div class="chartlegend"><span><i class="swatch alt"></i>Income</span><span><i class="swatch"></i>Logged spending</span></div></div></div><div class="grid"><div class="card"><h2>Biggest spends</h2>${[...sp].sort((a,b)=>b.amount-a.amount).slice(0,8).map(s=>`<div class="item"><div><strong>${esc(s.note||s.category)}</strong><div class="small muted">${fmtDate(s.date)} · ${esc(s.category)}</div></div><div class="row"><strong>${money(s.amount)}</strong>${btn('Delete','deleteSpend:'+s.id,'tiny')}</div></div>`).join('')||noData('No recorded spends this month.')}</div><div class="card"><h2>Monthly trend · logged spends</h2>${trend.map(x=>`<div class="barrow"><strong>${x.label}</strong><strong>${money(x.spend)}</strong></div>${prog(x.spend,max)}`).join('')}<p class="caption">Charts use your recorded entries, not live bank data. Bills are separate from category spend charts.</p></div></div></div>`}

const schemas={account:[['name','Account name','text'],['kind','Account type','select',['checking','savings']],['balance','Current balance','number']],income:[['name','Paycheck name','text'],['amount','Paycheck amount','number'],['schedule','Frequency','select',['weekly','biweekly','monthly','twice','months','once']],['anchor','First/anchor payday','date'],['day','Monthly day (1–31)','number'],['day2','Second monthly day (twice monthly)','number'],['interval','Every N months (2–12)','number'],['splits','Move % to savings on receipt','number']],bill:[['name','Bill name','text'],['amount','Amount due','number'],['cycle','Frequency','select',['monthly','twice','weekly','biweekly','months','once']],['anchor','First occurrence / anchor','date'],['day','Day of month (1–31)','number'],['day2','Second monthly day','number'],['interval','Every N months (2–12)','number'],['setAside','Reserve monthly for infrequent bill','checkbox']],goal:[['name','Goal name','text'],['target','Target amount','number'],['saved','Already reserved','number'],['due','Optional target date','date']],debt:[['name','Debt name','text'],['kind','Debt type','select',['card','loan']],['balance','Outstanding balance','number'],['apr','APR %','number'],['minimum','Minimum monthly payment','number'],['dueDay','Monthly due day','number']],envelope:[['name','Envelope category','select',categories],['amount','Envelope allocation','number']],budget:[['name','Spending category','select',categories],['limit','Monthly category limit','number']],challenge:[['name','Challenge name','text'],['kind','Track as','select',['weeks','days','amount']],['target','Target count / amount','number'],['progress','Current progress','number']],milestone:[['name','What did you do?','text'],['date','Date','date']]};

function updateBalance(delta){let a=p().accounts.find(x=>x.kind==='checking')||p().accounts.find(x=>x.kind!=='savings');if(a){a.balance=moneyVal(a.balance+delta);return a.id}return null}
function markedBill(key,paid){const parts=String(key).split('|');if(parts.length!==2)return false;const [id,d]=parts,b=p().bills.find(x=>String(x.id)===id);if(paid){if(!b||paymentFor(id,d))return false;const amount=moneyVal(b.amount),account=updateBalance(-amount);p().billPayments.push({key:paidKey(id,d),billId:id,occurrenceDate:d,date:d,name:b.name,account,amount});return true;}const item=paymentFor(id,d);if(!item)return false;const account=p().accounts.find(x=>x.id===item.account);if(account)account.balance=moneyVal(account.balance+Number(item.amount||0));p().billPayments=p().billPayments.filter(x=>x!==item);return true;}
function markedIncome(key,received){let [id,d]=key.split('|'),i=p().income.find(x=>x.id===id);if(!i)return;if(received){if(p().paychecks.some(x=>x.key===key))return;let split=moneyVal(i.amount*Math.min(100,Math.max(0,i.splits||0))/100),checking=updateBalance(i.amount-split),saving=p().accounts.find(a=>a.kind==='savings');if(!saving){split=0;if(checking){let a=p().accounts.find(a=>a.id===checking);a.balance=moneyVal(a.balance+i.amount-(i.amount-moneyVal(i.amount*Math.min(100,Math.max(0,i.splits||0))/100)))}}else saving.balance=moneyVal(saving.balance+split);p().paychecks.push({key,date:d,account:checking,savings:saving?.id||null,amount:i.amount,split})}else{let x=p().paychecks.find(x=>x.key===key);if(!x)return;const a=p().accounts.find(a=>a.id===x.account),s=p().accounts.find(a=>a.id===x.savings);if(a)a.balance=moneyVal(a.balance-(x.amount-x.split));if(s)s.balance=moneyVal(s.balance-x.split);p().paychecks=p().paychecks.filter(z=>z.key!==key)}}
function logSpend(amount,category,note,date0){amount=moneyVal(amount);if(amount<=0||!Number.isFinite(amount))return toast('Enter an amount above zero.');p().spends.push({id:uid(),date:date0||TODAY(),amount,category:category||'Other',note:note||'',account:updateBalance(-amount)});change(()=>{});toast('Spend saved. One step done.')}

function download(name,content,type){pendingExport={name,content,type};if(name.endsWith('.json')&&storageWorks){try{localStorage.setItem(BACKUP_META,TODAY());localStorage.setItem(BACKUP_NUDGE,TODAY())}catch(e){}}backupDismissed=true;try{const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Export prepared: '+name);modal(`<h2>Export ready</h2><p>Download requested: <strong>${esc(name)}</strong>. If your browser blocked it, use the Copy fallback below.</p><div class="formactions">${btn('Close','close')}${btn('Show & copy data','exportFallback','primary')}</div>`)}catch(e){exportFallback()}}
function exportFallback(){if(!pendingExport)return;modal(`<h2>Copy your ${pendingExport.name.endsWith('.csv')?'CSV':'JSON'} backup</h2><p class="muted">Select and copy this text if downloading was blocked.</p><textarea id="exportText" rows="13" readonly>${esc(pendingExport.content)}</textarea><div class="formactions">${btn('Close','close')}${btn('Copy data','copyExport','primary')}</div>`)}

function csv(){const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';let rows=[['Profile','Record type','Date','Name','Category','Amount','Detail']];for(let pp of db.profiles){for(let s of pp.spends)rows.push([pp.name,'spend',s.date,s.note,s.category,s.amount,'']);for(let b of pp.bills)rows.push([pp.name,'bill rule',b.anchor,b.name,b.cycle,b.amount,b.interval||'']);for(let i of pp.income)rows.push([pp.name,'income rule',i.anchor,i.name,i.schedule,i.amount,i.splits||0]);for(let x of pp.billPayments)rows.push([pp.name,'bill paid',x.date,x.key,'',x.amount,'']);for(let x of pp.paychecks)rows.push([pp.name,'paycheck received',x.date,x.key,'',x.amount,'']);for(let x of pp.debtPayments)rows.push([pp.name,'debt payment',x.date,x.name,x.kind,x.amount,'']);for(let x of pp.goals)rows.push([pp.name,'goal','',''+x.name,'',x.saved,'target '+x.target]);for(let x of pp.accounts)rows.push([pp.name,'account','',''+x.name,x.kind,x.balance,''])}download('Calm-Budget-Records.csv',rows.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')}

if(a==='removeCategory'){let k=kinds()[+t];if(!k)return;return modal(`<h2>Remove ${esc(k.name)}?</h2><p>Existing records keep their category label. New spends won't offer this kind.</p><div class="formactions">${btn('Cancel','close')}${btn('Remove','confirmRemoveKind:'+t,'danger')}</div>`)}

if(a==='splitSpend'){return modal(`<h2>Split a spend</h2><p class="caption">Enter a total and how much goes to each kind. The last kind receives the remainder.</p><div class="field"><label>Total</label><input id="splitTotal" type="number" min=".01" step=".01"></div><div class="fields"><div class="field"><label>First kind</label><select id="splitCatA">${kindOptions()}</select></div><div class="field"><label>First amount</label><input id="splitAmountA" type="number" min="0" step=".01"></div><div class="field"><label>Second kind</label><select id="splitCatB">${kindOptions()}</select></div><div class="field"><label>Note</label><input id="splitNote"></div></div><div class="formactions">${btn('Cancel','close')}${btn('Save split','saveSplit','primary')}</div>`)}
if(a==='saveSplit'){let total=moneyVal(document.getElementById('splitTotal').value),a=moneyVal(document.getElementById('splitAmountA').value),catA=document.getElementById('splitCatA').value,catB=document.getElementById('splitCatB').value,note=document.getElementById('splitNote').value;if(total<=0||a<0||a>total||!catA||!catB)return toast('Check total and split amounts.');change(()=>{let account=updateBalance(-total),id=uid();p().spends.push({id,date:TODAY(),amount:total,category:catA,note,account,splits:[{category:catA,amount:a},{category:catB,amount:moneyVal(total-a)}]})});closeModal();return toast('Split spend saved.')}
return legacySpectrumRun(act)};
const prevRevRender=render;render=function(){prevRevRender();let node=document.getElementById('quickCategory'),modalNode=document.getElementById('modalCategory');if(node)node.innerHTML=kindOptions(node.value);if(modalNode)modalNode.innerHTML=kindOptions(modalNode.value);let rep=document.getElementById('goalRepeat');if(rep){let cur=(p().goals.find(g=>g.id===enhanceGoalId)||p().goals[0]);if(cur)rep.checked=!!cur.repeatMonthly;}if(page==='Today'){let host=document.getElementById('content');if(host)host.insertAdjacentHTML('afterbegin',`<div class="row section">${btn('Split a spend','splitSpend')}${btn('? Help','contextHelp:Safe to Spend','tiny')}</div>`)} };
// Per-planner category selectors and month range custom fields.
document.addEventListener('change',e=>{if(['rangeFrom','rangeTo'].includes(e.target.id))return changeOption(e.target.id,e.target.value);if(e.target.id==='oneName'){let s=e.target.value.toLowerCase(),out=/refund|return/.test(s)?'Refund':/gift|birthday/.test(s)?'Gift':/freelance|client|project/.test(s)?'Work':'Other income';let f=document.getElementById('oneKind');if(f&&!f.value.trim())f.value=out}},true);
document.addEventListener('input',e=>{if(e.target.id==='faqSearch'){helpSearch=e.target.value;let rows=faqItems.filter(x=>x.join(' ').toLowerCase().includes(helpSearch.toLowerCase()));document.getElementById('faqHits').innerHTML=rows.map(([q,a])=>`<div class="notice" style="margin-top:10px"><strong>${esc(q)}</strong><p>${esc(a)}</p></div>`).join('')||noData('No matching answers.')}if(e.target.id==='contextSearch'){let text=e.target.value.toLowerCase();document.getElementById('contextResults').innerHTML=faqItems.filter(x=>x.join(' ').toLowerCase().includes(text)).map(([q,a])=>`<details open><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')||noData('No matching help.') }});
// Preserve selected goal pacing controls, and support opted-in recurring additions once per month.
function applyGoalDeposits(){let changed=false;for(let g of p().goals){if(!g.repeatMonthly||!g.repeatStart||!(Number(g.repeatAmount)>0))continue;let ym=month(g.repeatStart),now=month(TODAY()),steps=0;g.depositHistory=g.depositHistory||[];while(ym<=now&&steps++<120){let key='repeat:'+ym;if(!g.depositHistory.some(x=>x.key===key)&&ym>=month(g.repeatStart)){let amt=Math.min(moneyVal(g.repeatAmount),Math.max(0,moneyVal(g.target-g.saved)));if(amt>0){g.saved=moneyVal(g.saved+amt);g.depositHistory.push({key,date:ym+'-'+g.repeatStart.slice(8),amount:amt,auto:true});changed=true}}ym=iso(new Date(+ym.slice(0,4),+ym.slice(5),1)).slice(0,7)}}if(changed)save()}
const prevRevGoals=goalsPage;goalsPage=function(){let markup=prevRevGoals();return markup.replace('Keep this out of safe to spend</label>',`Keep this out of safe to spend</label><label class="toggle"><input type="checkbox" id="goalRepeat"> Repeat the deposit monthly</label>`)};
const beforeRevisionRun=runAction;runAction=function(act){if(['saveGoalOptions','depositGoal'].includes(act)){let id=document.getElementById('enhanceGoal')?.value,g=p().goals.find(x=>x.id===id);if(g){let repeat=document.getElementById('goalRepeat')?.checked||false,depRaw=document.getElementById('goalDeposit')?.value,amount=(depRaw===''||depRaw===null||depRaw===undefined)?(g.repeatAmount||0):moneyVal(depRaw||0),day=document.getElementById('goalDepositDate')?.value||TODAY();g.repeatMonthly=repeat;g.repeatAmount=amount;g.repeatStart=day}}return beforeRevisionRun(act)};
applyGoalDeposits();

if(DEMO){const pp=p(); if(!pp.demoBaseline){demoSetBase(pp); save();}}
render();if(p().onboard>0)checkAway();
</script></body></html>
